[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pea-tracker-collector"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["yfinance>=0.2.66,<2"]

[tool.setuptools.packages.find]
include = ["pea_collector*"]

[tool.setuptools.package-data]
pea_collector = ["mapping.synthetic.json"]

[dependency-groups]
dev = ["pytest>=9,<10", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
