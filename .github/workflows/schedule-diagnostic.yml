name: Temporary schedule diagnostic

on:
  schedule:
    - cron: '*/5 * * * *'

permissions: {}

# Observation only: 17 November 2026, 20:10-20:55 Europe/Paris.
# This cron recurs indefinitely. Explicitly disable this workflow at the end,
# then remove this file in a separately approved commit.
jobs:
  observe:
    if: github.repository == 'damienSavoldelli/pea-tracker' && github.ref == 'refs/heads/main' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Print schedule metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON_EXPRESSION: ${{ github.event.schedule }}
          TEST_START_UTC: '2026-11-17T19:10:00Z'
          TEST_END_UTC: '2026-11-17T19:55:00Z'
        run: |
          utc_now="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          printf 'utc=%s\nevent=%s\ncron=%s\n' "$utc_now" "$EVENT_NAME" "$CRON_EXPRESSION"
          if [[ "$utc_now" < "$TEST_START_UTC" || ! "$utc_now" < "$TEST_END_UTC" ]]; then
            printf '%s\n' 'observation=outside_test_window'
          else
            printf '%s\n' 'observation=inside_test_window'
          fi
