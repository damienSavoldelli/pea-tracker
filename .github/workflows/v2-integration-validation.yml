name: V2 integration validation

on:
  push:
    branches: [integration/v2.0]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: v2-integration-validation
  cancel-in-progress: false

jobs:
  contracts:
    if: github.repository == 'damienSavoldelli/pea-tracker' && github.ref == 'refs/heads/integration/v2.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci
      - run: node --version
      - run: npm run typecheck
      - name: Synthetic SDK, authorization, upgrade and scheduling contracts
        run: >-
          node node_modules/vitest/vitest.mjs run
          tests/v2-integration.test.ts tests/financial-mcp.test.ts
          tests/portfolio-reads.test.ts tests/portfolio-financial.test.ts
          tests/portfolio-financial.worker.test.ts tests/portfolio-registry.test.ts
          tests/portfolio-registry-migration.test.ts tests/portfolio-writes-migration.test.ts
          tests/scheduler.test.ts tests/collector-storage-sizing.test.ts
          --testTimeout=15000

  collector:
    if: github.repository == 'damienSavoldelli/pea-tracker' && github.ref == 'refs/heads/integration/v2.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install uv==0.10.4
      - run: uv sync --project collector --frozen
      - run: collector/.venv/bin/python --version
      - name: Offline experiments and native loopback counting only
        run: >-
          collector/.venv/bin/python -m pytest
          collector/tests/test_yahoo_cycle_experiment.py
          collector/tests/test_yfinance_offline_experiment.py
          collector/tests/test_yahoo_session_capture.py
          -o addopts='' -q
      - name: Cadence and closing completeness
        run: >-
          collector/.venv/bin/python -m pytest
          collector/tests/test_cloudflare_schedule.py collector/tests/test_automation.py
          -o addopts='' -q
          -k 'quarter_hour or frequency or cadence or closing_monitor or rejects_late or scheduler_config'
